<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title">
  <title id="og-title">صف — مدیریت صف رستوران</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dceee4" />
      <stop offset="55%" stop-color="#f5f8f6" />
      <stop offset="100%" stop-color="#e8f0eb" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40916c" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="980" cy="120" r="180" fill="#40916c" opacity="0.12" />
  <circle cx="180" cy="520" r="220" fill="#1b4332" opacity="0.08" />
  <rect x="80" y="80" width="1040" height="470" rx="32" fill="#ffffff" opacity="0.72" />
  <rect x="120" y="140" width="88" height="88" rx="20" fill="url(#accent)" />
  <text x="164" y="198" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">ص</text>
  <text x="240" y="188" direction="rtl" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="56" font-weight="800" fill="#1b4332">صف</text>
  <text x="240" y="232" direction="rtl" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="28" font-weight="600" fill="#40916c">مدیریت صف رستوران</text>
  <text x="1080" y="320" text-anchor="end" direction="rtl" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="40" font-weight="700" fill="#14201a">بدون ایستادن در صف نوبت بگیرید</text>
  <text x="1080" y="374" text-anchor="end" direction="rtl" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="27" fill="#5f6d66">PWA و اپ اندروید — برای مهمان و پرسنل رستوران</text>
